              ${f.currency === 'ALL' ? '' : 'Всего: '}${money(totals.total, unit)}
            </div>
            ${f.currency === 'ALL' && totals.byCurrency.length ? html`
              <div className="text-[12px] text-slate-400 num mt-1.5 leading-relaxed">${totals.byCurrency.map(x => money(x.amount, x.currency)).join(' · ')}</div>` : null}
            <div className="text-[11px] text-slate-500 mt-1">${totals.count} опер.${f.currency === 'ALL' && totals.byCurrency.some(x => x.currency !== base) ? ' · итог в ' + base + ' по курсу системы' : ''}</div>
          <//>

          ${beforeWindow ? html`<div className="text-[11px] text-amber-300 px-1">Операции доступны с ${dm(periodFrom)}.${periodFrom.slice(0, 4)} — более ранние даты не загружены.</div>` : null}

          ${!list.length ? html`
            <${Card} className="p-8 text-center">
              <div className="text-4xl mb-3">${isExp ? '🧾' : '💰'}</div>
              <div className="text-slate-400 text-sm">Нет операций за выбранный период</div>
              <div className="text-[11px] text-slate-600 mt-1">${range.label}${f.currency === 'ALL' ? '' : ' · ' + f.currency}</div>
            <//>` : html`
            <${Card} className="p-5">
              <${Donut} items=${agg.items} total=${agg.total} label=${isExp ? 'Расходы' : 'Доходы'} currency=${unit} />
              <div className="flex flex-wrap justify-center gap-x-3 gap-y-1.5 mt-4">
                ${agg.items.slice(0, 8).map(i => html`
                  <div key=${i.category} className="flex items-center gap-1.5 text-[11px] text-slate-400">
                    <span className="w-2 h-2 rounded-full" style=${{ background: i.color }}></span>${i.category}
                  </div>`)}
              </div>
            <//>

            <${Card} className="divide-y divide-white/5 overflow-hidden">
              ${agg.items.map(i => {
                const lim = limitsOn ? limitMap[i.category.toLowerCase()] : null;
                const b = !lim && limitsOn && showBudgets ? budgetMap[i.category.toLowerCase()] : null;
                const bp = b ? Math.min(100, b.spent / b.limit * 100) : 0;
                const lt = lim ? limitTone(lim.spent, lim.amount) : null;
                const toBase = v => convAmount(v, lim.currency, base, rates);
                const expanded = open === i.category;
                return html`
                  <div key=${i.category}>
                    <button className="w-full text-left px-4 py-3 active:bg-white/5 transition"
                      onClick=${() => { haptic(); setOpen(expanded ? null : i.category); }}>
                      <div className="flex items-center justify-between gap-3">
                        <div className="flex items-center gap-3 min-w-0">
                          <span className="w-2.5 h-2.5 rounded-full shrink-0" style=${{ background: i.color }}></span>
                          <div className="min-w-0">
                            <div className="text-sm font-medium truncate">${i.category}</div>
                            <div className="text-[11px] text-slate-500">${i.count} опер.</div>
                          </div>
                        </div>
                        <div className="text-right shrink-0">
                          <div className="text-sm font-semibold num">${money(i.value, unit)}</div>
                          <div className="text-[11px] text-slate-500 num">${fmt(i.pct, 1)}%</div>
                        </div>
                      </div>
                      <div className="h-1.5 rounded-full bg-white/5 mt-2.5 overflow-hidden">
                        <div className="h-full rounded-full bar-fill" style=${{ width: Math.max(1.5, i.pct) + '%', background: i.color }}></div>
                      </div>
                      ${b ? html`
                        <div className="flex items-center justify-between mt-2 text-[11px] num">
                          <span className=${bp >= 100 ? 'text-rose-300' : bp >= 80 ? 'text-amber-300' : 'text-slate-500'}>Бюджет ${fmt(b.spent)} / ${fmt(b.limit)} €</span>
                          <span className=${'px-1.5 py-0.5 rounded-md ' + (bp >= 100 ? 'bg-rose-500/15 text-rose-300' : bp >= 80 ? 'bg-amber-500/15 text-amber-300' : 'bg-emerald-500/10 text-emerald-300')}>
                            ${bp >= 100 ? 'превышен' : 'осталось ' + fmt(b.limit - b.spent) + ' €'}
                          </span>
                        </div>` : null}
                      ${lim ? html`
                        <div className="mt-2">
                          <div className="h-1 rounded-full bg-white/5 overflow-hidden">
                            <div className=${'h-full rounded-full bar-fill ' + lt.bar} style=${{ width: Math.max(2, Math.min(100, lt.pct)) + '%' }}></div>
                          </div>
                          <div className="flex items-center justify-between mt-1.5 text-[11px] num gap-2">
                            <span className=${lt.text}>Лимит ${money(lim.spent, lim.currency)} / ${money(lim.amount, lim.currency)}${lim.currency !== base && toBase(lim.amount) !== null ? ' (≈ ' + money(toBase(lim.spent), base) + ' / ' + money(toBase(lim.amount), base) + ')' : ''}</span>
                            <span className=${'px-1.5 py-0.5 rounded-md shrink-0 ' + lt.badge}>${fmt(lt.pct, 0)}%</span>
                          </div>
                        </div>` : null}
                    </button>
                    ${expanded ? html`
                      <div className="bg-black/20 px-4 py-2 fade-in">
                        ${i.items.slice(0, 50).map(t => html`<${SmartTxRow} key=${t.id} t=${t} fallback=${i.category} />`)}
                      </div>` : null}
                  </div>`;
              })}
            <//>
            ${isExp && !limitsOn ? html`<div className="text-[11px] text-slate-600 text-center">Месячные лимиты показываются для «1 мес» во «Все валюты»</div>` : null}

            <div>
              <div className="px-1 mb-2 text-xs uppercase tracking-widest text-slate-500">Операции</div>
              <${Card} className="px-4 py-1">
                ${list.slice(0, limit).map(t => html`<${SmartTxRow} key=${t.id} t=${t} fallback=${t.category} showCategory=${true} />`)}
              <//>
              ${list.length > limit ? html`
                <button onClick=${() => { haptic(); setLimit(limit + 30); }}
                  className="w-full mt-2 py-2.5 rounded-2xl bg-white/5 border border-white/5 text-sm text-slate-300 active:bg-white/10">Показать ещё (${list.length - limit})</button>` : null}
            </div>`}

          ${sheet ? html`<${PeriodSheet} f=${f} range=${range}
            onClose=${() => setSheet(false)}
            onApply=${(from, to) => { setFilter(Object.assign({}, f, { periodPreset: 'CUSTOM', customFrom: from <= to ? from : to, customTo: from <= to ? to : from })); setSheet(false); }}
            onReset=${() => { setFilter(Object.assign({}, f, { periodPreset: '1M', customFrom: null, customTo: null })); setSheet(false); }} />` : null}
        </div>`;
    }

    function SmartTxRow({ t, fallback, showCategory }) {
      return html`
        <div className="flex items-center justify-between gap-3 py-2 border-b border-white/5 last:border-0">
          <div className="min-w-0">
            <div className="text-[13px] truncate">${t.merchant || fallback}</div>
            <div className="text-[11px] text-slate-500 truncate">${shortDate(t.date)}${showCategory ? ' · ' + t.category : ''} · ${t.user} · ${t.account}</div>
          </div>
          <div className="text-right shrink-0">
            <div className="text-[13px] num">${money(t.amount, t.currency)}</div>
            ${t.currency !== 'EUR' ? html`<div className="text-[11px] text-slate-500 num">≈ ${money(t.eur, 'EUR')}</div>` : null}
          </div>
        </div>`;
    }

    const KIND_META = {
      expense: { label: 'Трата', icon: '🛒', badge: 'bg-rose-500/15 text-rose-300' },
      income: { label: 'Доход', icon: '💰', badge: 'bg-emerald-500/15 text-emerald-300' },
      transfer: { label: 'Перевод', icon: '💱', badge: 'bg-sky-500/15 text-sky-300' },
      adjust: { label: 'Сверка', icon: '🧮', badge: 'bg-slate-500/20 text-slate-300' },
      other: { label: 'Другое', icon: '•', badge: 'bg-slate-500/20 text-slate-300' }
    };

    function HistoryItem({ t }) {
      const meta = KIND_META[t.kind] || KIND_META.other;
      let title, sub, right, rightSub;
      if (t.kind === 'transfer') {
        const isFx = t.fromCur && t.toCur && t.fromCur !== t.toCur;
        title = isFx ? (t.fromCur + ' → ' + t.toCur) : 'Перевод между счетами';
        sub = (t.from || '—') + ' → ' + (t.to || '—') + (t.fxQuote ? ' · ' + t.fxQuote : '');
        right = html`<div className="text-sm font-semibold num text-rose-300/90">−${money(t.fromAmt, t.fromCur)}</div>`;
        rightSub = html`<div className="text-[11px] num text-emerald-300/90">+${money(t.toAmt, t.toCur)}</div>`;
      } else if (t.kind === 'adjust') {
        const hasFact = t.fact !== null && t.fact !== undefined;
        const delta = t.delta !== undefined ? t.delta : t.amount;
        title = hasFact ? 'Сверка остатка: зафиксировано ' + money(t.fact, t.currency) : 'Сверка остатка';
        sub = (t.account || '—') + ' · корректировка Δ ' + signed(delta, t.currency);
        right = hasFact ? html`<div className="text-sm font-semibold num text-slate-200">${money(t.fact, t.currency)}</div>` : null;
        rightSub = html`<div className="text-[11px] text-slate-500 num">Δ ${signed(delta, t.currency)}</div>`;
      } else {
        title = t.merchant || t.category || '—';
        sub = [t.category, t.account].filter(Boolean).join(' · ');
        const color = t.kind === 'expense' ? 'text-rose-300' : t.kind === 'income' ? 'text-emerald-300' : 'text-slate-200';
        right = html`<div className=${'text-sm font-semibold num ' + color}>${signed(t.amount, t.currency)}</div>`;
        rightSub = t.currency !== 'EUR' && t.eur !== null && t.eur !== undefined
          ? html`<div className="text-[11px] text-slate-500 num">≈ ${signed(t.eur, 'EUR')}</div>` : null;
      }
      return html`
        <div className="px-4 py-3 flex items-start justify-between gap-3">
          <div className="flex items-start gap-3 min-w-0">
            <div className="w-9 h-9 rounded-2xl bg-white/5 flex items-center justify-center text-base shrink-0">${meta.icon}</div>
            <div className="min-w-0">
              <div className="text-sm font-medium truncate">${title}</div>
              <div className="text-[11px] text-slate-500 truncate">${sub}</div>
              <div className="flex flex-wrap items-center gap-1 mt-1">
                <span className=${'text-[10px] px-1.5 py-0.5 rounded-md ' + meta.badge}>${meta.label}</span>
                <span className="text-[10px] px-1.5 py-0.5 rounded-md bg-white/5 text-slate-400">${t.user || '—'}</span>
                ${t.match === 'MERGED' ? html`<span className="text-[10px] px-1.5 py-0.5 rounded-md bg-violet-500/15 text-violet-300">🔗 сверено</span>` : null}
                ${t.match === 'STATEMENT' ? html`<span className="text-[10px] px-1.5 py-0.5 rounded-md bg-indigo-500/15 text-indigo-300">📑 выписка</span>` : null}
              </div>
            </div>
          </div>
          <div className="text-right shrink-0">${right}${rightSub}</div>
        </div>`;
    }

    function HistoryTab({ history, user }) {
      const [query, setQuery] = useState('');
      const [kind, setKind] = useState('all');
      const [limit, setLimit] = useState(80);

      const filtered = useMemo(() => {
        const q = query.trim().toLowerCase();
        return history.filter(t => {
          if (!matchUser(t, user)) return false;
          if (kind !== 'all' && t.kind !== kind) return false;
          if (!q) return true;
          const hay = [t.merchant, t.category, t.account, t.from, t.to, t.user, t.currency, t.fromCur, t.toCur,
            t.amount !== undefined ? String(Math.abs(t.amount)) : '', t.fromAmt !== undefined ? String(t.fromAmt) : '',
            t.toAmt !== undefined ? String(t.toAmt) : ''].join(' ').toLowerCase();
          return hay.indexOf(q) !== -1;
        });
      }, [history, user, kind, query]);

      const groups = useMemo(() => {
        const out = [];
        let cur = null;
        filtered.slice(0, limit).forEach(t => {
          if (!cur || cur.date !== t.date) { cur = { date: t.date, items: [] }; out.push(cur); }
          cur.items.push(t);
        });
        return out;
      }, [filtered, limit]);

      const kinds = [
        { value: 'all', label: 'Все' }, { value: 'expense', label: 'Траты' }, { value: 'income', label: 'Доходы' },
        { value: 'transfer', label: 'Обмены' }, { value: 'adjust', label: 'Сверки' }
      ];

      return html`
        <div className="space-y-3 fade-in">
          <div className="relative">
            <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-500 text-sm">🔍</span>
            <input value=${query} onChange=${e => { setQuery(e.target.value); setLimit(80); }}
              placeholder="Магазин, категория, счёт, сумма…"
              className="w-full rounded-2xl bg-white/5 border border-white/5 pl-10 pr-10 py-3 text-sm outline-none focus:border-sky-400/50 placeholder:text-slate-600" />
            ${query ? html`<button onClick=${() => setQuery('')} className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 w-6 h-6">✕</button>` : null}
          </div>
          <div className="flex gap-1.5 overflow-x-auto no-scrollbar -mx-4 px-4">
            ${kinds.map(k => html`
              <button key=${k.value} onClick=${() => { haptic(); setKind(k.value); setLimit(80); }}
                className=${'shrink-0 text-xs px-3 py-1.5 rounded-full border transition ' +
                  (kind === k.value ? 'bg-white text-slate-900 border-white' : 'bg-white/5 text-slate-400 border-white/5')}>
                ${k.label}
              </button>`)}
          </div>

          ${!groups.length ? html`<div className="text-center text-slate-500 text-sm py-14">Ничего не найдено</div>` : null}

          ${groups.map(g => html`
            <div key=${g.date}>
              <div className="px-1 mb-1.5 mt-2 text-xs font-medium text-slate-500">${dayTitle(g.date)}</div>
              <${Card} className="divide-y divide-white/5 overflow-hidden">
                ${g.items.map(t => html`<${HistoryItem} key=${t.id} t=${t} />`)}
              <//>
            </div>`)}

          ${filtered.length > limit ? html`
            <button onClick=${() => setLimit(limit + 80)}
              className="w-full py-3 rounded-2xl bg-white/5 border border-white/5 text-sm text-slate-300 active:bg-white/10">
              Показать ещё (${filtered.length - limit})
            </button>` : null}
          <div className="text-[11px] text-slate-600 text-center pb-2">Показаны последние ${history.length} записей</div>
        </div>`;
    }

    /* ============================== ⚙️ Настройки ============================== */

    const SETTINGS_DEFAULT = { hideZero: true, baseCurrency: 'EUR', notifyPartner: true };
    const LIMIT_PERIODS = [{ value: 'DAY', label: 'День' }, { value: 'WEEK', label: 'Неделя' }, { value: 'MONTH', label: 'Месяц' }];
    const PERIOD_TEXT = { DAY: 'день', WEEK: 'неделя', MONTH: 'месяц' };
    const LIMIT_CURRENCIES = ['EUR', 'RSD', 'USD', 'RUB'];

    /** Зелёный → жёлтый (≥ 80%) → красный (> 100%). */
    function limitTone(spent, amount) {
      const pct = amount > 0 ? spent / amount * 100 : 0;
      if (spent > amount + 0.005) return { pct, bar: 'bg-rose-400', text: 'text-rose-300', badge: 'bg-rose-500/15 text-rose-300', label: 'превышен' };
      if (pct >= 80) return { pct, bar: 'bg-amber-400', text: 'text-amber-300', badge: 'bg-amber-500/15 text-amber-300', label: 'почти' };
      return { pct, bar: 'bg-emerald-400', text: 'text-emerald-300', badge: 'bg-emerald-500/10 text-emerald-300', label: 'в норме' };
    }

    function Toggle({ checked, onChange, disabled, label }) {
      return html`
        <button role="switch" aria-checked=${checked} aria-label=${label} disabled=${disabled}
          onClick=${() => { haptic(); onChange(!checked); }}
          className=${'relative shrink-0 w-12 h-7 rounded-full transition-colors duration-200 disabled:opacity-50 ' + (checked ? 'bg-sky-400' : 'bg-white/15')}>
          <span className=${'absolute top-0.5 left-0.5 w-6 h-6 rounded-full bg-white shadow transition-transform duration-200 ' + (checked ? 'translate-x-5' : '')}></span>
        </button>`;
    }

    function SettingRow({ title, hint, children }) {
      return html`
        <div className="px-4 py-3.5 flex items-center justify-between gap-4">
          <div className="min-w-0">
            <div className="text-sm font-medium">${title}</div>
            ${hint ? html`<div className="text-[11px] text-slate-500 mt-0.5 leading-snug">${hint}</div>` : null}
          </div>
          ${children}
        </div>`;
    }

    function SectionTitle({ children }) {
      return html`<div className="px-1 mb-2 text-xs uppercase tracking-widest text-slate-500">${children}</div>`;
    }

    function LimitForm({ initial, categories, users, busy, onSave, onDelete, onCancel }) {
      const [f, setF] = useState(initial);
      const set = patch => setF(Object.assign({}, f, patch));
      const amount = Number(String(f.amount || '').replace(/\s/g, '').replace(',', '.'));
      const valid = f.category && amount > 0;
      const scopes = [{ value: 'FAMILY', label: 'Семья' }].concat(users.map(u => ({ value: u.name, label: u.name })));
      const isNew = !f.id;
      return html`
        <div className="px-4 py-4 space-y-3 bg-black/20 fade-in">
          ${isNew ? html`
            <label className="block">
              <span className="text-[11px] text-slate-400">Категория</span>
              <select value=${f.category} onChange=${e => set({ category: e.target.value })} className="sf-date">
                <option value="">— выберите —</option>
                ${categories.map(c => html`<option key=${c} value=${c}>${c}</option>`)}
              </select>
            </label>` : null}
          <label className="block">
            <span className="text-[11px] text-slate-400">Лимит</span>
            <div className="flex gap-2 mt-1">
              <input type="text" inputMode="decimal" value=${f.amount} placeholder="10000" onChange=${e => set({ amount: e.target.value })}
                className="sf-date !mt-0 flex-1 num" />
              <select value=${f.currency} onChange=${e => set({ currency: e.target.value })} className="sf-date !mt-0 !w-24">
                ${LIMIT_CURRENCIES.map(c => html`<option key=${c} value=${c}>${c}</option>`)}
              </select>
            </div>
          </label>
          ${isNew ? html`
            <div>
              <div className="text-[11px] text-slate-400 mb-1">Период</div>
              <${Segmented} options=${LIMIT_PERIODS} value=${f.period} onChange=${v => set({ period: v })} size="sm" />
            </div>
            <div>
              <div className="text-[11px] text-slate-400 mb-1">Чьи траты</div>
              <${Segmented} options=${scopes} value=${f.scope} onChange=${v => set({ scope: v })} size="sm" />
            </div>` : null}
          <div className=${'grid gap-2 ' + (isNew ? 'grid-cols-2' : 'grid-cols-3')}>
            <button onClick=${onCancel} disabled=${busy} className="py-2.5 rounded-2xl bg-white/5 border border-white/10 text-sm text-slate-300 active:bg-white/10">Отмена</button>
            ${!isNew ? html`<button onClick=${() => onDelete(f)} disabled=${busy} className="py-2.5 rounded-2xl bg-rose-500/15 border border-rose-500/20 text-sm text-rose-300 active:bg-rose-500/25 disabled:opacity-40">Удалить</button>` : null}
            <button onClick=${() => onSave(Object.assign({}, f, { amount: amount }))} disabled=${!valid || busy}
              className="py-2.5 rounded-2xl bg-sky-400 text-slate-900 text-sm font-semibold active:scale-[.98] transition disabled:opacity-40">${busy ? '…' : 'Сохранить'}</button>
          </div>
        </div>`;
    }

    function SettingsTab({ data, settings, onSettings, savingKey, limits, setLimits, users }) {
      const [editing, setEditing] = useState(null); // id лимита или 'new'
      const [busy, setBusy] = useState(false);
      const [note, setNote] = useState(null);       // { ok, text }
      const [backup, setBackup] = useState(null);
      const categories = data.expenseCategories && data.expenseCategories.length ? data.expenseCategories : Array.from(new Set((limits || []).map(l => l.category)));
      const s = Object.assign({}, SETTINGS_DEFAULT, settings || {});

      async function run(action, payload, okText) {
        setBusy(true);
        setNote(null);
        try {
          const j = await apiPost(action, payload);
          if (j.limits) setLimits(j.limits);
          setEditing(null);
          if (okText) setNote({ ok: true, text: okText });
          try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
          return j;
        } catch (e) {
          setNote({ ok: false, text: e && e.message ? e.message : String(e) });
          try { if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('error'); } catch (er) {}
          return null;
        } finally {
          setBusy(false);
        }
      }

      async function doBackup() {
        haptic();
        const j = await run('backup', {}, null);
        if (j && j.backup) setBackup(j.backup);
      }

      return html`
        <div className="space-y-5 fade-in">
          ${note ? html`
            <div className=${'rounded-2xl px-3 py-2 text-xs border ' + (note.ok ? 'bg-emerald-500/10 border-emerald-500/20 text-emerald-200' : 'bg-rose-500/10 border-rose-500/20 text-rose-200')}>${note.text}</div>` : null}

          <div>
            <${SectionTitle}>🎯 Лимиты расходов<//>
            <${Card} className="divide-y divide-white/5 overflow-hidden">
              ${!(limits || []).length && editing !== 'new' ? html`
                <div className="px-4 py-5 text-center">
                  <div className="text-sm text-slate-400">Лимитов пока нет</div>
                  <div className="text-[11px] text-slate-600 mt-1">Или в чате: /setlimit Кофе 10000 RSD месяц семья</div>
                </div>` : null}
              ${(limits || []).map(l => {
                const tone = limitTone(l.spent, l.amount);
                return html`
                  <div key=${l.id}>
                    <button className="w-full text-left px-4 py-3 active:bg-white/5 transition" onClick=${() => { haptic(); setEditing(editing === l.id ? null : l.id); }}>
                      <div className="flex items-center justify-between gap-3">
                        <div className="min-w-0">
                          <div className="text-sm font-medium truncate">${l.category}</div>
                          <div className="text-[11px] text-slate-500">${PERIOD_TEXT[l.period] || l.period} · ${l.scope === 'FAMILY' ? 'семья' : l.scope}</div>
                        </div>
                        <div className="text-right shrink-0">
                          <div className=${'text-sm font-semibold num ' + tone.text}>${money(l.spent, l.currency)} <span className="text-slate-500 font-normal">/ ${money(l.amount, l.currency)}</span></div>
                          <span className=${'text-[10px] px-1.5 py-0.5 rounded-md num ' + tone.badge}>${fmt(tone.pct, 0)}% · ${tone.label}</span>
                        </div>
                      </div>
                      <div className="h-1.5 rounded-full bg-white/5 mt-2.5 overflow-hidden">
                        <div className=${'h-full rounded-full bar-fill ' + tone.bar} style=${{ width: Math.max(2, Math.min(100, tone.pct)) + '%' }}></div>
                      </div>
                    </button>
                    ${editing === l.id ? html`<${LimitForm} key=${'e' + l.id} initial=${{ id: l.id, category: l.category, amount: String(l.amount), currency: l.currency, period: l.period, scope: l.scope }}
                      categories=${categories} users=${users} busy=${busy}
                      onCancel=${() => setEditing(null)}
                      onSave=${v => run('saveLimit', { limit: v }, '✅ Лимит «' + v.category + '» обновлён')}
                      onDelete=${v => run('deleteLimit', { id: v.id }, '🗑 Лимит «' + v.category + '» удалён')} />` : null}
                  </div>`;
              })}
              ${editing === 'new' ? html`<${LimitForm} key="new" initial=${{ category: '', amount: '', currency: s.baseCurrency || 'EUR', period: 'MONTH', scope: 'FAMILY' }}
                categories=${categories} users=${users} busy=${busy}
                onCancel=${() => setEditing(null)}
                onSave=${v => run('saveLimit', { limit: v }, '✅ Лимит «' + v.category + '» сохранён')} />` : html`
                <button onClick=${() => { haptic(); setNote(null); setEditing('new'); }} className="w-full px-4 py-3 text-sm text-sky-300 text-left active:bg-white/5">＋ Добавить лимит</button>`}
            <//>
            <div className="text-[11px] text-slate-600 px-1 mt-1.5 leading-snug">Траты считаются за текущий день / неделю (с понедельника) / месяц в валюте лимита. При 80% — предупреждение в карточке, при превышении — алерт автору и супругу.</div>
          </div>

          <div>
            <${SectionTitle}>👁 Отображение<//>
            <${Card} className="divide-y divide-white/5 overflow-hidden">
              <${SettingRow} title="Скрывать счета с нулевым балансом" hint="В капитал они входят в любом случае">
                <${Toggle} label="Скрывать счета с нулевым балансом" checked=${s.hideZero} disabled=${savingKey === 'hideZero'} onChange=${v => onSettings({ hideZero: v })} />
              <//>
              <div className="px-4 py-3.5">
                <div className="text-sm font-medium">Базовая валюта интерфейса</div>
                <div className="text-[11px] text-slate-500 mt-0.5 mb-2.5">Капитал на вкладке «Счета» и итоги «Все валюты» в расходах и доходах</div>
                <${Segmented} options=${CONFIG.CURRENCIES.map(c => ({ value: c, label: c }))} value=${s.baseCurrency} onChange=${v => onSettings({ baseCurrency: v })} size="sm" />
              </div>
            <//>
          </div>

          <div>
            <${SectionTitle}>🔔 Семейные уведомления<//>
            <${Card} className="overflow-hidden">
              <${SettingRow} title="Оповещать меня о превышении лимитов партнёром" hint="Личное сообщение от бота, когда трата супруга(и) выводит категорию за лимит">
                <${Toggle} label="Оповещать о превышении лимитов партнёром" checked=${s.notifyPartner} disabled=${savingKey === 'notifyPartner'} onChange=${v => onSettings({ notifyPartner: v })} />
              <//>
            <//>
          </div>

          <div>
            <${SectionTitle}>🛠 Обслуживание<//>
            <${Card} className="p-4">
              <div className="text-sm font-medium">Резервная копия</div>
              <div className="text-[11px] text-slate-500 mt-0.5 leading-snug">Копии листов Accounts, Transactions, Crypto_Trades и Limits в той же таблице (Backup_Now_…). Хранятся 5 последних.</div>
              <button onClick=${doBackup} disabled=${busy}
                className="w-full mt-3 py-3 rounded-2xl bg-white text-slate-900 text-sm font-semibold active:scale-[.98] transition disabled:opacity-50">${busy && !editing ? 'Создаю копию…' : '💾 Backup_Now'}</button>
              ${backup ? html`<div className="text-[11px] text-emerald-300 mt-2 num">✅ ${backup.at}: ${backup.sheets.length} листа${backup.removed ? ' · удалено старых: ' + backup.removed : ''}</div>` : null}
            <//>
          </div>

          <div className="text-[11px] text-slate-600 text-center pb-2">Настройки личные: у каждого члена семьи свои</div>
        </div>`;
    }

    function Skeleton() {
      return html`
        <div className="space-y-4">
          <div className="h-11 rounded-2xl skeleton"></div>
          <div className="h-44 rounded-3xl skeleton"></div>
          <div className="h-24 rounded-3xl skeleton"></div>
          <div className="h-64 rounded-3xl skeleton"></div>
        </div>`;
    }

    function ErrorBox({ message, onRetry }) {
      return html`
        <div className="fade-in text-center py-16 px-4">
          <div className="text-5xl mb-4">⚠️</div>
          <div className="text-sm text-slate-300 mb-5 leading-relaxed">${message}</div>
          <button onClick=${onRetry} className="px-5 py-2.5 rounded-2xl bg-white text-slate-900 text-sm font-medium active:scale-95 transition">Повторить</button>
        </div>`;
    }

    function App() {
      const [month, setMonth] = useState(currentMonth());
      const [user, setUser] = useState('all');
      const [tab, setTab] = useState('accounts');
      const [currency, setCurrency] = useState('EUR');
      // Умный фильтр: отдельное состояние для «Расходов» и «Доходов», живёт при переключении вкладок
      const [smartFilter, setSmartFilter] = useState({ expense: SMART_DEFAULT, income: SMART_DEFAULT });
      const setTabFilter = kind => next => setSmartFilter(prev => Object.assign({}, prev, { [kind]: next }));
      const [data, setData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const reqId = useRef(0);
      // Личные настройки (⚙️): приходят с дашбордом, сохраняются doPost?action=saveSettings
      const [settings, setSettings] = useState(SETTINGS_DEFAULT);
      const [savingKey, setSavingKey] = useState('');
      const currencyTouched = useRef(false);
      const pickCurrency = c => { currencyTouched.current = true; setCurrency(c); };

      useEffect(() => {
        if (!data || !data.settings) return;
        setSettings(Object.assign({}, SETTINGS_DEFAULT, data.settings));
        if (!currencyTouched.current && data.settings.baseCurrency) setCurrency(data.settings.baseCurrency);
      }, [data && data.settings]);

      const settingsRef = useRef(settings);
      settingsRef.current = settings;
      const saveSettings = useCallback(async patch => {
        const key = Object.keys(patch)[0];
        const prev = settingsRef.current;
        setSettings(Object.assign({}, prev, patch));
        if (patch.baseCurrency) { currencyTouched.current = false; setCurrency(patch.baseCurrency); }
        setSavingKey(key);
        try {
          const j = await apiPost('saveSettings', { settings: patch });
          setSettings(Object.assign({}, SETTINGS_DEFAULT, j.settings));
        } catch (e) {
          if (prev) setSettings(prev);
          setError('Настройка не сохранена: ' + (e && e.message ? e.message : e));
        } finally {
          setSavingKey('');
        }
      }, []);
      const setLimits = useCallback(list => setData(d => (d ? Object.assign({}, d, { limits: list }) : d)), []);

      const load = useCallback(async m => {
        const id = ++reqId.current;
        setLoading(true);
        setError('');
        try {
          const d = await fetchDashboard(m);
          if (id === reqId.current) setData(d);
        } catch (e) {
          if (id === reqId.current) setError(e && e.message ? e.message : String(e));
        } finally {
          if (id === reqId.current) setLoading(false);
        }
      }, []);

      useEffect(() => { load(month); }, [month, load]);
      useEffect(() => { window.scrollTo({ top: 0, behavior: 'smooth' }); }, [tab]);

      const users = data && data.users && data.users.length ? data.users : CONFIG.FALLBACK_USERS;
      const monthTx = useMemo(() => {
        if (!data) return [];
        return data.monthTx.filter(t => matchUser(t, user));
      }, [data, user]);
      const pool = useMemo(() => (data ? pnlPool(data) : []), [data]);

      let content = null;
      if (error && !data) content = html`<${ErrorBox} message=${error} onRetry=${() => load(month)} />`;
      else if (!data) content = html`<${Skeleton} />`;
      else if (tab === 'accounts') content = html`<${AccountsTab} data=${data} currency=${currency} setCurrency=${pickCurrency} monthTx=${monthTx} month=${month} user=${user} users=${users} setTab=${setTab} hideZero=${settings.hideZero} />`;
      else if (tab === 'expense') content = html`<${CategoryTab} key="expense" kind="expense" pool=${pool} user=${user} month=${month} periodFrom=${data.periodFrom}
        filter=${smartFilter.expense} setFilter=${setTabFilter('expense')} budgets=${data.budgets} showBudgets=${user === 'all'} baseCurrency=${settings.baseCurrency} rates=${data.rates}
        limits=${data.limits || []} users=${users} />`;
      else if (tab === 'income') content = html`<${CategoryTab} key="income" kind="income" pool=${pool} user=${user} month=${month} periodFrom=${data.periodFrom}
        filter=${smartFilter.income} setFilter=${setTabFilter('income')} budgets=${[]} showBudgets=${false} baseCurrency=${settings.baseCurrency} rates=${data.rates} />`;
      else if (tab === 'crypto') content = html`<${CryptoTab} data=${data} user=${user} users=${users} />`;
      else if (tab === 'settings') content = html`<${SettingsTab} data=${data} settings=${settings} onSettings=${saveSettings} savingKey=${savingKey}
        limits=${data.limits || []} setLimits=${setLimits} users=${users} />`;
      else content = html`<${HistoryTab} history=${data.history} user=${user} />`;

      return html`
        <div className="min-h-screen">
          <${Header} month=${month} setMonth=${setMonth} months=${data ? data.months : []} user=${user} setUser=${setUser}
            users=${users} loading=${loading} onRefresh=${() => { haptic(); load(month); }} showMonth=${tab !== 'history' && tab !== 'crypto' && tab !== 'settings' && !((tab === 'expense' || tab === 'income') && smartFilter[tab].periodPreset !== '1M')}
            showUsers=${tab !== 'settings'} />
          <main className="px-4 pt-4" style=${{ paddingBottom: 'calc(96px + var(--app-bottom))' }}>
            ${error && data ? html`<div className="mb-3 rounded-2xl bg-rose-500/10 border border-rose-500/20 text-rose-200 text-xs px-3 py-2">${error}</div>` : null}
            <div className=${loading && data ? 'opacity-60 transition-opacity' : 'transition-opacity'}>${content}</div>
          </main>
          <${BottomNav} tab=${tab} setTab=${setTab} muted=${[]} />
        </div>`;
    }

    initTelegram();
    ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
  })();
  </script>
</body>
</html>
