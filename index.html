<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f19">
  <title>Семейный бюджет</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --app-top: calc(var(--tg-safe-area-inset-top, env(safe-area-inset-top, 0px)) + var(--tg-content-safe-area-inset-top, 0px));
      --app-bottom: var(--tg-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
    }
    html, body { background: var(--bg); color: #e5e7eb; margin: 0; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
    .fade-in { animation: fadeIn .28s ease-out both; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .bar-fill { transition: width .6s cubic-bezier(.2,.8,.2,1); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { scrollbar-width: none; }
    /* Умный фильтр: горизонтальный скролл чипов не перехватывается свайпами Telegram */
    .filter-chips-scroll { display: flex; gap: 6px; overflow-x: auto; white-space: nowrap; scrollbar-width: none; -ms-overflow-style: none;
      -webkit-overflow-scrolling: touch; overscroll-behavior-x: contain; touch-action: pan-x; padding: 4px 16px; }
    .filter-chips-scroll::-webkit-scrollbar { display: none; }
    .sf-chip { flex: 0 0 auto; padding: 6px 12px; border-radius: 11px; font-size: 12px; font-weight: 500; color: #94a3b8;
      background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.06); transition: background .15s, color .15s, border-color .15s; }
    .sf-chip:active { transform: scale(.97); }
    .sf-chip-active { color: #0b0f19; background: #38bdf8; border-color: #38bdf8; font-weight: 600; }
    .sf-backdrop { animation: sfFade .2s ease-out both; }
    .sf-sheet { animation: sfUp .26s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes sfFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes sfUp { from { transform: translateY(100%); } to { transform: none; } }
    .sf-date { display: block; width: 100%; margin-top: 4px; padding: 10px 12px; border-radius: 12px; color: #e5e7eb; background: #0b0f19;
      border: 1px solid rgba(255,255,255,.1); color-scheme: dark; font-size: 15px; outline: none; }
    .sf-date:focus { border-color: rgba(56,189,248,.6); }
    .skeleton { background: linear-gradient(90deg, #111827 0%, #1f2937 50%, #111827 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite linear; }
    @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  </style>
</head>
<body>
  <div id="root"></div>
  <script>
  (function () {
    'use strict';

    /* ================= НАСТРОЙКА: вставьте URL веб-приложения Apps Script ================= */
    const CONFIG = {
      API_URL: 'https://script.google.com/macros/s/AKfycbzpGbFsakhdjlQohuK5yEtYxnStjmTIkoxYi0Z51h5kmyqXAPzUoZ2DhvngBldOX9LTLQ/exec',
      CURRENCIES: ['EUR', 'RSD', 'USD', 'RUB'],
      FALLBACK_USERS: [{ id: '408235862', name: 'Stefan' }, { id: '676401561', name: 'Мария' }]
    };

    const { useState, useEffect, useMemo, useRef, useCallback } = React;
    const html = htm.bind(React.createElement);
    const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;

    const PALETTE = ['#60a5fa', '#f472b6', '#34d399', '#fbbf24', '#a78bfa', '#f87171', '#22d3ee', '#fb923c', '#4ade80', '#e879f9', '#94a3b8', '#facc15', '#2dd4bf', '#c084fc'];
    const SYMBOL = { EUR: '€', RSD: 'RSD', USD: '$', RUB: '₽', USDT: 'USDT', USDC: 'USDC' };
    const MONTHS = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
    const MONTHS_GEN = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
    const WEEKDAYS = ['вс', 'пн', 'вт', 'ср', 'чт', 'пт', 'сб'];

    /* ================================ Утилиты ================================ */

    function fmt(n, maxDec) {
      if (n === null || n === undefined || isNaN(n)) return '—';
      const d = maxDec === undefined ? 2 : maxDec;
      return Number(n).toLocaleString('ru-RU', { minimumFractionDigits: 0, maximumFractionDigits: d });
    }
    function decFor(cur) { return cur === 'RSD' || cur === 'RUB' ? 0 : 2; }
    function money(n, cur, dec) { return fmt(n, dec === undefined ? decFor(cur) : dec) + ' ' + (SYMBOL[cur] || cur); }
    function signed(n, cur, dec) { return (n > 0 ? '+' : n < 0 ? '−' : '') + money(Math.abs(n), cur, dec); }
    function pad2(n) { return (n < 10 ? '0' : '') + n; }
    function localToday() { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
    function currentMonth() { return localToday().slice(0, 7); }
    function monthTitle(m) { const p = m.split('-'); return MONTHS[Number(p[1]) - 1] + ' ' + p[0]; }
    function shiftMonth(m, delta) {
      const p = m.split('-').map(Number);
      const d = new Date(p[0], p[1] - 1 + delta, 1);
      return d.getFullYear() + '-' + pad2(d.getMonth() + 1);
    }
    function dayTitle(iso) {
      const today = localToday();
      const y = new Date(); y.setDate(y.getDate() - 1);
      const yesterday = y.getFullYear() + '-' + pad2(y.getMonth() + 1) + '-' + pad2(y.getDate());
      if (iso === today) return 'Сегодня';
      if (iso === yesterday) return 'Вчера';
      const p = iso.split('-').map(Number);
      const d = new Date(p[0], p[1] - 1, p[2]);
      return p[2] + ' ' + MONTHS_GEN[p[1] - 1] + (p[0] !== new Date().getFullYear() ? ' ' + p[0] : '') + ', ' + WEEKDAYS[d.getDay()];
    }
    function shortDate(iso) { const p = String(iso).split('-'); return p.length === 3 ? p[2] + '.' + p[1] : iso; }
    function matchUser(t, user) {
      if (user === 'all') return true;
      if (String(t.userId) === String(user)) return true;
      if (user === '408235862' && /stefan|beleda|беледа/i.test(t.user)) return true;
      if (user === '676401561' && /(мари|маша|maria|mariia|vasiutcheva)/i.test(t.user)) return true;
      return false;
    }
    function accountOwner(a) {
      if (a.owner) return String(a.owner);
      const m = String(a.name || '').match(/\(([^)]+)\)\s*$/);
      if (!m) return '';
      if (/stefan|beleda|беледа/i.test(m[1])) return '408235862';
      if (/(мари|маша|maria|mariia)/i.test(m[1])) return '676401561';
      return '';
    }
    function isCashAccount(a) { const n = a.name || ''; return /наличн|кэш|кеш|cash|кошел/i.test(n) && !/крипто|crypto|usdt|usdc/i.test(n); }
    function accountLabel(a) { return String(a.name || '').replace(/\s*\([^)]*\)\s*$/, ''); }
    function haptic() { try { if (tg && tg.HapticFeedback) tg.HapticFeedback.selectionChanged(); } catch (e) {} }

    function initTelegram() {
      if (!tg) return;
      try { tg.ready(); } catch (e) {}
      try { tg.expand(); } catch (e) {}
      try { tg.setHeaderColor('#0b0f19'); tg.setBackgroundColor('#0b0f19'); } catch (e) {}
      try { if (tg.setBottomBarColor) tg.setBottomBarColor('#0b0f19'); } catch (e) {}
      try { if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
      try {
        const mobile = ['ios', 'android', 'android_x'].indexOf(tg.platform) !== -1;
        if (mobile && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.requestFullscreen) tg.requestFullscreen();
      } catch (e) {}
    }

    /** Запись из Mini App: doPost?action=… (text/plain — без CORS-preflight, подпись initData в теле). */
    async function apiPost(action, payload) {
      const initData = tg && tg.initData ? tg.initData : '';
      if (!initData) throw new Error('Откройте приложение из Telegram — вне Telegram сохранение недоступно.');
      const res = await fetch(CONFIG.API_URL + '?action=' + encodeURIComponent(action), {
        method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ initData: initData }, payload || {}))
      });
      if (!res.ok) throw new Error('Сервер ответил HTTP ' + res.status);
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || 'Ошибка API');
      return j;
    }

    async function fetchDashboard(month) {
      if (CONFIG.API_URL.indexOf('ВСТАВЬТЕ') !== -1) throw new Error('В index.html не задан API_URL веб-приложения Apps Script.');
      const initData = tg && tg.initData ? tg.initData : '';
      if (!initData) throw new Error('Откройте приложение из Telegram — вне Telegram данные недоступны.');
      const url = CONFIG.API_URL + '?action=dashboard&month=' + encodeURIComponent(month) +
        '&initData=' + encodeURIComponent(initData) + '&_=' + Date.now();
      const res = await fetch(url, { method: 'GET', redirect: 'follow' });
      if (!res.ok) throw new Error('Сервер ответил HTTP ' + res.status);
      const j = await res.json();
      if (!j.ok) throw new Error(j.error || 'Ошибка API');
      return j.data;
    }

    function aggregate(list) {
      const map = {};
      let total = 0;
      list.forEach(t => {
        const k = t.category || 'Без категории';
        if (!map[k]) map[k] = { category: k, eur: 0, count: 0, items: [] };
        map[k].eur += t.eur || 0;
        map[k].count += 1;
        map[k].items.push(t);
        total += t.eur || 0;
      });
      const items = Object.keys(map).map(k => map[k]).sort((a, b) => b.eur - a.eur);
      items.forEach((it, i) => {
        it.color = PALETTE[i % PALETTE.length];
        it.pct = total > 0 ? it.eur / total * 100 : 0;
        it.items.sort((a, b) => (a.date < b.date ? 1 : -1));
      });
      return { items, total };
    }

    /* ============================ Умный фильтр: логика ============================
     * Только клиент: фильтрует уже загруженные операции (data.monthTx ∪ data.periodTx) без запросов.
     * Видимость = владелец (Все/Stefan/Мария) И валюта И период И тип «Расход»/«Доход».
     * Переводы, сверки и крипто-сделки в эти массивы бэкенд не кладёт, но тип всё равно проверяется.
     * Балансы, капитал и вкладку «Счета» фильтр не трогает.
     */
    const SMART_CURRENCIES = ['ALL', 'EUR', 'RSD', 'RUB', 'USD', 'USDT'];
    const SMART_PRESETS = [
      { id: '1D', label: '1 день' }, { id: '1W', label: '1 нед' }, { id: '2W', label: '2 нед' },
      { id: '1M', label: '1 мес' }, { id: 'CUSTOM', label: '📅 Период' }
    ];
    const SMART_DEFAULT = { currency: 'ALL', periodPreset: '1M', customFrom: null, customTo: null };

    function isoOf(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
    function addDaysIso(iso, n) { const p = iso.split('-').map(Number); return isoOf(new Date(p[0], p[1] - 1, p[2] + n)); }
    function monthEndIso(month) { const p = month.split('-').map(Number); return isoOf(new Date(p[0], p[1], 0)); }
    function dm(iso) { const p = iso.split('-'); return p[2] + '.' + p[1]; }

    /** Границы периода включительно: { from, to, label }. «1 мес» — месяц, выбранный в шапке (как P&L). */
    function smartRange(f, month, today) {
      const t = today || localToday();
      switch (f.periodPreset) {
        case '1D': return { from: t, to: t, label: 'Сегодня' };
        case '1W': return { from: addDaysIso(t, -6), to: t, label: '7 дней · ' + dm(addDaysIso(t, -6)) + '–' + dm(t) };
        case '2W': return { from: addDaysIso(t, -13), to: t, label: '14 дней · ' + dm(addDaysIso(t, -13)) + '–' + dm(t) };
        case 'CUSTOM': {
          let a = f.customFrom || t, b = f.customTo || t;
          if (a > b) { const x = a; a = b; b = x; }
          return { from: a, to: b, label: dm(a) + (a.slice(0, 4) !== t.slice(0, 4) ? '.' + a.slice(0, 4) : '') + ' – ' + dm(b) + (b.slice(0, 4) !== t.slice(0, 4) ? '.' + b.slice(0, 4) : '') };
        }
        default: return { from: month + '-01', to: monthEndIso(month), label: monthTitle(month) };
      }
    }

    /** Все операции «Расход»/«Доход» из ответа API без дублей (месяц из шапки + окно periodTx). */
    function pnlPool(data) {
      const seen = {};
      const out = [];
      [].concat(data.periodTx || [], data.monthTx || []).forEach(t => { if (!seen[t.id]) { seen[t.id] = 1; out.push(t); } });
      return out;
    }

    /** Строгий AND: тип И владелец И валюта И дата. Новые сверху. */
    function smartFilterTx(pool, kind, f, user, range) {
      return pool.filter(t =>
        t.kind === kind &&
        matchUser(t, user) &&
        (f.currency === 'ALL' || t.currency === f.currency) &&
        t.date >= range.from && t.date <= range.to
      ).sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
    }

    /** Сумма для отображения: «Все валюты» — в базовой валюте по курсу системы (allRate = курс EUR→база, по умолчанию EUR), конкретная валюта — точные суммы в ней. */
    function smartValue(t, currency, allRate) { return currency === 'ALL' ? (t.eur || 0) * (allRate || 1) : (t.amount || 0); }

    /** Итог и расшифровка по реальным валютам операций. */
    function smartTotals(list, currency, allRate) {
      const by = {};
      let total = 0;
      list.forEach(t => { total += smartValue(t, currency, allRate); by[t.currency] = (by[t.currency] || 0) + (t.amount || 0); });
      const byCurrency = Object.keys(by).map(c => ({ currency: c, amount: by[c] })).sort((a, b) => b.amount - a.amount);
      return { total: total, byCurrency: byCurrency, count: list.length };
    }

    /** Категории по убыванию: в EUR («Все валюты») или строго в выбранной валюте. */
    function smartCategories(list, currency, allRate) {
      const map = {};
      let total = 0;
      list.forEach(t => {
        const k = t.category || 'Без категории';
        const v = smartValue(t, currency, allRate);
        if (!map[k]) map[k] = { category: k, value: 0, eur: 0, count: 0, items: [] };
        map[k].value += v;
        map[k].eur += t.eur || 0;
        map[k].count += 1;
        map[k].items.push(t);
        total += v;
      });
      const items = Object.keys(map).map(k => map[k]).sort((a, b) => b.value - a.value);
      items.forEach((it, i) => { it.color = PALETTE[i % PALETTE.length]; it.pct = total > 0 ? it.value / total * 100 : 0; });
      return { items: items, total: total };
    }

    /* ============================== Компоненты ============================== */

    function Segmented({ options, value, onChange, size }) {
      const small = size === 'sm';
      return html`
        <div className=${'flex p-1 rounded-2xl bg-white/5 border border-white/5 ' + (small ? 'text-xs' : 'text-sm')}>
          ${options.map(o => html`
            <button key=${o.value}
              onClick=${() => { if (o.value !== value) { haptic(); onChange(o.value); } }}
              className=${'flex-1 rounded-xl transition-all duration-200 font-medium ' + (small ? 'py-1.5 px-2 ' : 'py-2 px-3 ') +
                (o.value === value ? 'bg-white text-slate-900 shadow' : 'text-slate-400 active:bg-white/10')}>
              ${o.label}
            </button>`)}
        </div>`;
    }

    function Card({ children, className }) {
      return html`<div className=${'rounded-3xl bg-[#111827] border border-white/5 ' + (className || '')}>${children}</div>`;
    }

    function Donut({ items, total, label, currency }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);
      const curRef = useRef(currency || 'EUR');
      curRef.current = currency || 'EUR';

      useEffect(() => {
        const data = {
          labels: items.map(i => i.category),
          datasets: [{
            data: items.map(i => Math.round((i.value !== undefined ? i.value : i.eur) * 100) / 100),
            backgroundColor: items.map(i => i.color),
            borderColor: '#111827',
            borderWidth: 3,
            hoverOffset: 6,
            borderRadius: 4
          }]
        };
        if (!chartRef.current) {
          chartRef.current = new Chart(canvasRef.current, {
            type: 'doughnut',
            data: data,
            options: {
              cutout: '74%',
              responsive: true,
              maintainAspectRatio: true,
              animation: { animateRotate: true, duration: 700 },
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: '#1f2937',
                  borderColor: 'rgba(255,255,255,.08)',
                  borderWidth: 1,
                  padding: 10,
                  callbacks: { label: ctx => ' ' + ctx.label + ': ' + money(ctx.parsed, curRef.current) }
                }
              }
            }
          });
        } else {
          chartRef.current.data = data;
          chartRef.current.update();
        }
      }, [items]);

      useEffect(() => () => {
        if (chartRef.current) { chartRef.current.destroy(); chartRef.current = null; }
      }, []);

      return html`
        <div className="relative mx-auto w-full" style=${{ maxWidth: '250px' }}>
          <canvas ref=${canvasRef}></canvas>
          <div className="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
            <div className="text-[11px] uppercase tracking-wider text-slate-500">${label}</div>
            <div className="text-2xl font-semibold num mt-0.5">${money(total, currency || 'EUR')}</div>
          </div>
        </div>`;
    }

    function Header({ month, setMonth, months, user, setUser, users, loading, onRefresh, showMonth, showUsers }) {
      const canNext = shiftMonth(month, 1) <= currentMonth();
      const oldest = months && months.length ? months[months.length - 1] : '2000-01';
      const canPrev = shiftMonth(month, -1) >= oldest;
      const userOptions = [{ value: 'all', label: 'Все' }].concat(users.map(u => ({ value: u.id, label: u.name })));
      return html`
        <header className="sticky top-0 z-20 bg-[#0b0f19]/90 backdrop-blur-xl border-b border-white/5"
          style=${{ paddingTop: 'var(--app-top)' }}>
          <div className="px-4 pt-3 pb-3 space-y-3">
            <div className="flex items-center justify-between">
              <div>
                <div className="text-[11px] uppercase tracking-widest text-slate-500">Beleda Budget</div>
                <div className="text-lg font-semibold">Семейный бюджет</div>
              </div>
              <button onClick=${onRefresh} aria-label="Обновить"
                className=${'w-10 h-10 rounded-2xl bg-white/5 border border-white/5 flex items-center justify-center active:scale-95 transition ' + (loading ? 'animate-spin' : '')}>
                <span className="text-lg">↻</span>
              </button>
            </div>
            ${showMonth && html`
              <div className="flex items-center justify-between rounded-2xl bg-white/5 border border-white/5 px-2 py-1.5">
                <button disabled=${!canPrev} onClick=${() => { haptic(); setMonth(shiftMonth(month, -1)); }}
                  className="w-9 h-9 rounded-xl text-xl text-slate-300 disabled:opacity-20 active:bg-white/10">‹</button>
                <div className="text-sm font-medium">${monthTitle(month)}${month === currentMonth() ? html`<span className="ml-2 text-[10px] px-1.5 py-0.5 rounded-md bg-sky-500/15 text-sky-300 align-middle">текущий</span>` : null}</div>
                <button disabled=${!canNext} onClick=${() => { haptic(); setMonth(shiftMonth(month, 1)); }}
                  className="w-9 h-9 rounded-xl text-xl text-slate-300 disabled:opacity-20 active:bg-white/10">›</button>
              </div>`}
            ${showUsers !== false ? html`<${Segmented} options=${userOptions} value=${user} onChange=${setUser} size="sm" />` : null}
          </div>
        </header>`;
    }

    function BottomNav({ tab, setTab, muted }) {
      const tabs = [
        { id: 'accounts', icon: '💳', label: 'Счета' },
        { id: 'expense', icon: '📉', label: 'Расходы' },
        { id: 'income', icon: '📈', label: 'Доходы' },
        { id: 'crypto', icon: '🪙', label: 'Крипта' },
        { id: 'history', icon: '📜', label: 'История' },
        { id: 'settings', icon: '⚙️', label: 'Настройки' }
      ];
      return html`
        <nav className="fixed bottom-0 inset-x-0 z-30 bg-[#0b0f19]/95 backdrop-blur-xl border-t border-white/5"
          style=${{ paddingBottom: 'var(--app-bottom)' }}>
          <div className="grid grid-cols-6 px-0.5 pt-1.5 pb-2">
            ${tabs.map(t => html`
              <button key=${t.id} onClick=${() => { if (t.id !== tab) { haptic(); setTab(t.id); } }}
                className="flex flex-col items-center gap-0.5 py-1.5 rounded-2xl active:bg-white/5 transition">
                <span className=${'text-xl transition-transform duration-200 ' + (tab === t.id ? 'scale-110' : 'opacity-50 grayscale') + ((muted || []).indexOf(t.id) !== -1 ? ' opacity-20' : '')}>${t.icon}</span>
                <span className=${'text-[10px] font-medium max-w-full truncate px-0.5 ' + (tab === t.id ? 'text-white' : 'text-slate-500')}>${t.label}</span>
                <span className=${'h-1 w-1 rounded-full transition-all ' + (tab === t.id ? 'bg-sky-400' : 'bg-transparent')}></span>
              </button>`)}
          </div>
        </nav>`;
    }

    function AccountsTab({ data, currency, setCurrency, monthTx, month, user, users, setTab, hideZero }) {
      const rate = data.rates && data.rates[currency] ? data.rates[currency] : null;
      const conv = eur => (eur === null || eur === undefined || !rate ? null : eur * rate);
      const income = monthTx.filter(t => t.kind === 'income').reduce((s, t) => s + (t.eur || 0), 0);
      const expense = monthTx.filter(t => t.kind === 'expense').reduce((s, t) => s + (t.eur || 0), 0);
      const net = income - expense;

      const personal = user !== 'all';
      const nameOf = id => ((users || []).find(u => String(u.id) === String(id)) || {}).name || '';
      const userName = personal ? nameOf(user) : '';
      const sumEur = list => list.reduce((s, a) => s + (a.eur || 0), 0);
      const accounts = personal ? data.accounts.filter(a => accountOwner(a) === String(user)) : data.accounts;
      const cashEur = sumEur(accounts.filter(isCashAccount));
      const bankEur = sumEur(accounts.filter(a => !isCashAccount(a)));
      const userCap = (data.capitalByUser || {})[String(user)];
      const cryptoEur = personal
        ? (userCap ? userCap.cryptoEur || 0 : (String(user) === String(data.cryptoOwner || '408235862') ? data.capital.cryptoEur : 0))
        : data.capital.cryptoEur;
      const byUser = data.capitalByUser && data.capitalByUser[String(user)];
      const personalTotal = byUser ? byUser.totalEur : cashEur + bankEur + cryptoEur;
      // «Все»: однотипные счета семьи (одно название без «(владельца)» и одна валюта) схлопываются в строку
      const FAMILY_ORDER = ['наличные eur', 'наличные rsd', 'банк рф rub', 'freedom usd', 'freedom eur', 'сербский банк rsd', 'крипто-кошелек usdt'];
      const family = [];
      if (!personal) {
        const byKey = {};
        data.accounts.forEach(a => {
          const label = accountLabel(a);
          const k = label.toLowerCase() + '|' + a.currency;
          let g = byKey[k];
          if (!g) { g = byKey[k] = { name: label, currency: a.currency, balance: 0, eur: 0, eurKnown: true, asOf: '', parts: [] }; family.push(g); }
          g.balance += a.balance || 0;
          if (a.eur === null || a.eur === undefined) g.eurKnown = false; else g.eur += a.eur;
          g.parts.push({ who: nameOf(accountOwner(a)) || 'без владельца', balance: a.balance });
        });
        family.forEach(g => { g.balance = Math.round(g.balance * 1e8) / 1e8; if (!g.eurKnown) g.eur = null; });
        const rank = g => { const i = FAMILY_ORDER.indexOf(g.name.toLowerCase()); return i === -1 ? FAMILY_ORDER.length : i; };
        family.sort((x, y) => rank(x) - rank(y));
      }
      // «Скрывать счета с нулевым балансом» (⚙️ Настройки, по умолчанию вкл.): нули и пыль (< 0.01) не показываем —
      // в капитал они входят как и раньше. Выключено — видны все счета, кроме пустых стейблкоин-счетов.
      const isZero = a => Math.abs(a.balance || 0) < 0.01;
      const visible = a => !(isZero(a) && (hideZero !== false || /^(USDT|USDC)$/.test(a.currency)));
      const hiddenZero = hideZero !== false && accounts.some(isZero);
      // Крипто-портфель профиля — отдельной карточкой в списке, чтобы сумма карточек сходилась с шапкой
      const cryptoRep = personal ? ((data.cryptoByUser || {})[String(user)] || (!data.cryptoByUser && String(user) === String(data.cryptoOwner || '408235862') ? data.crypto : null)) : data.crypto;
      const cryptoAssets = cryptoRep && Array.isArray(cryptoRep.assets) ? cryptoRep.assets.filter(a => a.holdings > 0) : [];
      const showCrypto = cryptoAssets.length > 0 && cryptoEur > 0;
      const groups = (personal
        ? [{ key: String(user), title: 'Счета · ' + userName, items: accounts.filter(visible) }]
        : [{ key: 'family', title: 'Счета семьи', items: family.filter(visible) }]).filter(g => g.items.length || showCrypto);
      const cryptoCard = showCrypto ? html`
        <button key="crypto-card" onClick=${() => { haptic(); if (setTab) setTab('crypto'); }} className="w-full text-left px-4 py-3 active:bg-white/5 transition block">
          <div className="flex items-center justify-between gap-3">
            <div className="min-w-0">
              <div className="text-sm font-medium truncate">🪙 Крипто-портфель <span className="text-slate-500">›</span></div>
              <div className="text-[11px] text-slate-500 mt-1 truncate">${cryptoAssets.slice(0, 6).map(a => a.asset).join(' · ')}</div>
            </div>
            <div className="text-right shrink-0">
              <div className="text-sm font-semibold num">${money(conv(cryptoEur), currency)}</div>
              ${currency !== 'USD' && cryptoRep.totalValueUsd ? html`<div className="text-[11px] text-slate-500 num">≈ ${money(cryptoRep.totalValueUsd, 'USD', 0)}</div>` : null}
            </div>
          </div>
        </button>` : null;

      const maxEur = Math.max.apply(null, accounts.map(a => Math.abs(a.eur || 0)).concat([1]));
      const negative = accounts.filter(a => a.balance < 0);
      const negativeEur = negative.reduce((s, a) => s + (a.eur || 0), 0);

      return html`
        <div className="space-y-4 fade-in">
          <${Segmented} options=${CONFIG.CURRENCIES.map(c => ({ value: c, label: c }))} value=${currency} onChange=${setCurrency} />

          <div className="rounded-3xl p-5 bg-gradient-to-br from-sky-500/20 via-indigo-500/10 to-transparent border border-white/10">
            ${personal ? html`
              <div className="text-xs uppercase tracking-widest text-slate-400">Личный капитал · ${userName}</div>
              <div className="text-4xl font-semibold num mt-2 tracking-tight">${rate ? money(conv(personalTotal), currency) : 'нет курса'}</div>
              <div className=${'grid gap-2 mt-4 ' + (cryptoEur ? 'grid-cols-3' : 'grid-cols-2')}>
                <div className="rounded-2xl bg-black/20 px-3 py-2.5">
                  <div className="text-[11px] text-slate-400">Банки и карты</div>
                  <div className="text-sm font-medium num">${money(conv(bankEur), currency)}</div>
                </div>
                <div className="rounded-2xl bg-black/20 px-3 py-2.5">
                  <div className="text-[11px] text-slate-400">Наличные</div>
                  <div className="text-sm font-medium num">${money(conv(cashEur), currency)}</div>
                </div>
                ${cryptoEur ? html`
                  <div className="rounded-2xl bg-black/20 px-3 py-2.5">
                    <div className="text-[11px] text-slate-400">Крипто</div>
                    <div className="text-sm font-medium num">${money(conv(cryptoEur), currency)}</div>
                  </div>` : null}
              </div>
            ` : html`
              <div className="text-xs uppercase tracking-widest text-slate-400">Капитал семьи · сейчас</div>
              <div className="text-4xl font-semibold num mt-2 tracking-tight">${rate ? money(conv(data.capital.totalEur), currency) : 'нет курса'}</div>
              <div className="grid grid-cols-2 gap-3 mt-4">
                <div className="rounded-2xl bg-black/20 px-3 py-2.5">
                  <div className="text-[11px] text-slate-400">Счета</div>
                  <div className="text-sm font-medium num">${money(conv(data.capital.fiatEur), currency)}</div>
                </div>
                <div className="rounded-2xl bg-black/20 px-3 py-2.5">
                  <div className="text-[11px] text-slate-400">Крипто</div>
                  <div className="text-sm font-medium num">${money(conv(data.capital.cryptoEur), currency)}</div>
                </div>
              </div>
            `}
            ${currency !== 'EUR' && rate ? html`<div className="text-[11px] text-slate-500 mt-3 num">1 € = ${fmt(rate, 4)} ${currency}</div>` : null}
            ${negative.length ? html`
              <div className="mt-3 rounded-2xl bg-rose-500/10 border border-rose-500/20 px-3 py-2 text-[11px] text-rose-200 leading-relaxed">
                ⚠️ ${negative.length === 1 ? 'Счёт' : 'Счета'} в минусе: ${negative.map(a => a.name).join(', ')}.
                Минус уменьшает капитал на <span className="num font-semibold">${money(Math.abs(conv(negativeEur) || 0), currency)}</span>.
                Если это не долг — проведите сверку остатка или задайте начальный баланс.
              </div>` : null}
          </div>

          <${Card} className="p-4">
            <div className="flex items-center justify-between mb-3">
              <div className="text-sm font-medium">P&L · ${monthTitle(month)}</div>
              <div className="text-[11px] text-slate-500">без обменов и сверок</div>
            </div>
            <div className="grid grid-cols-3 gap-2 text-center">
              <div className="rounded-2xl bg-emerald-500/10 py-2.5">
                <div className="text-[11px] text-emerald-300/80">Доходы</div>
                <div className="text-sm font-semibold text-emerald-300 num">${signed(conv(income), currency)}</div>
              </div>
              <div className="rounded-2xl bg-rose-500/10 py-2.5">
                <div className="text-[11px] text-rose-300/80">Расходы</div>
                <div className="text-sm font-semibold text-rose-300 num">${signed(-conv(expense), currency)}</div>
              </div>
              <div className="rounded-2xl bg-white/5 py-2.5">
                <div className="text-[11px] text-slate-400">Итог</div>
                <div className=${'text-sm font-semibold num ' + (net >= 0 ? 'text-emerald-300' : 'text-rose-300')}>${signed(conv(net), currency)}</div>
              </div>
            </div>
          <//>

          ${!accounts.length ? html`<div className="text-center text-slate-500 text-sm py-6">У ${userName} пока нет личных счетов</div>` : null}
          ${groups.map(g => html`
            <div key=${g.key}>
              <div className="px-1 mb-2 flex items-baseline justify-between">
                <div className="text-xs uppercase tracking-widest text-slate-500">${g.title}</div>
                ${!personal ? html`<div className="text-[11px] text-slate-500 num">≈ ${money(conv(sumEur(g.items) + (showCrypto ? cryptoEur : 0)), currency)}</div>` : null}
              </div>
              <${Card} className="divide-y divide-white/5 overflow-hidden">
                ${cryptoCard}
                ${g.items.map(a => html`
                  <div key=${a.name} className="px-4 py-3">
                    <div className="flex items-center justify-between gap-3">
                      <div className="min-w-0">
                        <div className="text-sm font-medium truncate">${accountLabel(a)}</div>
                        <div className="flex flex-wrap items-center gap-1.5 mt-1">
                          <span className="text-[10px] px-1.5 py-0.5 rounded-md bg-white/10 text-slate-300 font-semibold">${a.currency}</span>
                          ${a.parts ? html`<span className="text-[11px] text-slate-500 num">${a.parts.length > 1
                            ? a.parts.map(p => p.who + ': ' + money(p.balance, a.currency, a.currency === 'USDT' ? 2 : decFor(a.currency))).join(' · ')
                            : '👤 ' + a.parts[0].who}</span>` : null}
                          ${a.asOf ? html`<span className="text-[10px] px-1.5 py-0.5 rounded-md bg-amber-500/15 text-amber-300">сверка ${shortDate(a.asOf)}</span>` : null}
                          ${a.balance < 0 ? html`<span className="text-[10px] px-1.5 py-0.5 rounded-md bg-rose-500/20 text-rose-300 font-medium">требуется сверка/пополнение</span>` : null}
                        </div>
                      </div>
                      <div className="text-right shrink-0">
                        <div className=${'text-sm font-semibold num ' + (a.balance < 0 ? 'text-rose-300' : '')}>${money(a.balance, a.currency, a.currency === 'USDT' ? 2 : decFor(a.currency))}</div>
                        ${a.currency !== currency && a.eur !== null ? html`<div className="text-[11px] text-slate-500 num">≈ ${money(conv(a.eur), currency)}</div>` : null}
                      </div>
                    </div>
                    <div className="h-1 rounded-full bg-white/5 mt-2 overflow-hidden">
                      <div className=${'h-full rounded-full bar-fill ' + (a.balance < 0 ? 'bg-rose-400/70' : 'bg-sky-400/60')} style=${{ width: Math.max(2, Math.abs(a.eur || 0) / maxEur * 100) + '%' }}></div>
                    </div>
                  </div>`)}
              <//>
            </div>`)}
          ${hiddenZero ? html`<div className="text-[11px] text-slate-600 text-center">Счета с нулевым балансом скрыты · ⚙️ Настройки</div>` : null}

          ${data.fx ? html`<${FxPanel} fx=${data.fx} user=${user} rates=${data.rates} />` : data.fxStats.length ? html`
            <div>
              <div className="px-1 mb-2 text-xs uppercase tracking-widest text-slate-500">Обмены · ${monthTitle(month)}</div>
              <${Card} className="divide-y divide-white/5 overflow-hidden">
                ${data.fxStats.map(s => {
                  const quote = s.pair.split('/')[1];
                  const base = s.pair.split('/')[0];
                  const market = data.rates && data.rates[quote] && data.rates[base] ? data.rates[quote] / data.rates[base] : null;
                  const dev = market && s.avgRate ? (s.avgRate / market - 1) * 100 : null;
                  return html`
                    <div key=${s.pair} className="px-4 py-3 flex items-center justify-between gap-3">
                      <div>
                        <div className="text-sm font-semibold">${s.pair}</div>
                        <div className="text-[11px] text-slate-500 num">${s.count} обм. · ${fmt(s.baseAmt)} ${base} → ${fmt(s.quoteAmt)} ${quote}</div>
                      </div>
                      <div className="text-right">
                        <div className="text-sm font-semibold num">1 ${base} = ${fmt(s.avgRate, 4)}</div>
                        <div className=${'text-[11px] num ' + (s.resultEur >= 0 ? 'text-emerald-300' : 'text-rose-300')}>
                          ${signed(s.resultEur, 'EUR')}${dev !== null ? ' · ' + (dev >= 0 ? '+' : '') + fmt(dev, 2) + '% к рынку' : ''}
                        </div>
                      </div>
                    </div>`;
                })}
              <//>
            </div>` : null}

          <div className="text-[11px] text-slate-600 text-center pb-2">Курсы: ${data.fxUpdated || '—'} · обновлено ${data.generatedAt}</div>
        </div>`;
    }

    /* ======================= 💱 Активы и валютный рынок (FX) =======================
     * Данные — data.fx с бэкенда: сделки обмена (без рублей) с рыночным курсом на дату записи и готовые
     * метрики VWAP по владельцу × паре × периоду. Здесь только выбор пары/периода и графики Chart.js.
     */
    const FX_TABS = [{ value: 'EUR_RSD', label: 'EUR / RSD' }, { value: 'USD_RSD', label: 'USD / RSD' }, { value: 'EUR_USD', label: 'EUR / USD' }, { value: 'USDT', label: 'USDT / Фиат' }];
    const FX_PERIODS = [{ value: '1M', label: '1 мес' }, { value: '3M', label: '3 мес' }, { value: 'ALL', label: 'Всё время' }];
    const FX_DAYS = { '1M': 30, '3M': 90, 'ALL': null };

    function rateDec(v) { return v >= 20 ? 2 : 4; }
    function tsOf(iso) { return Date.parse(iso + 'T12:00:00'); }
    function ddmm(ts) { const d = new Date(ts); return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1); }

    /** Chart.js в контейнере фиксированной высоты: ширина всегда = ширине карточки (390px без скролла). */
    function ChartBox({ config, height }) {
      const ref = useRef(null);
      const chart = useRef(null);
      useEffect(() => {
        if (chart.current) chart.current.destroy();
        chart.current = new Chart(ref.current, config);
        return () => { if (chart.current) { chart.current.destroy(); chart.current = null; } };
      }, [config]);
      return html`<div className="relative w-full" style=${{ height: (height || 180) + 'px' }}><canvas ref=${ref}></canvas></div>`;
    }

    function FxPanel({ fx, user, rates }) {
      const scope = user === 'all' ? 'all' : String(user);
      const stats = (fx.stats && (fx.stats[scope] || fx.stats.all)) || {};
      const mine = useMemo(() => (fx.deals || []).filter(d => scope === 'all' || d.userId === scope), [fx, scope]);
      const has = id => mine.some(d => d.pair === id);
      const firstTab = (FX_TABS.find(t => (t.value === 'USDT' ? has('USDT_RSD') || has('USDT_EUR') : has(t.value))) || FX_TABS[0]).value;
      const [tab, setTab] = useState(firstTab);
      const [period, setPeriod] = useState('3M');
      const [usdtQuote, setUsdtQuote] = useState(has('USDT_RSD') || !has('USDT_EUR') ? 'RSD' : 'EUR');
      useEffect(() => { setTab(firstTab); }, [scope]);
      const pairId = tab === 'USDT' ? 'USDT_' + usdtQuote : tab;
      const meta = (fx.pairs || []).find(p => p.id === pairId) || { base: 'EUR', quote: 'RSD' };
      const s = (stats[pairId] || {})[period] || {};
      const main = s.main, rev = s.reverse;
      const from = FX_DAYS[period] ? addDaysIso(localToday(), -FX_DAYS[period]) : '';
      const deals = mine.filter(d => d.pair === pairId && d.date >= from);
      const rb = rateOf(meta.base, rates), rq = rateOf(meta.quote, rates);
      const marketNow = rb && rq ? rq / rb : null;

      const scatter = useMemo(() => {
        if (!deals.length) return null;
        const maxBase = Math.max.apply(null, deals.map(d => d.baseAmt));
        const pt = d => ({ x: tsOf(d.date), y: d.rate, r: 4 + 10 * Math.sqrt(d.baseAmt / maxBase), d: d });
        const market = deals.filter(d => d.market).map(d => ({ x: tsOf(d.date), y: d.market }));
        if (marketNow) market.push({ x: Date.now(), y: marketNow });
        market.sort((a, b) => a.x - b.x);
        const xs = deals.map(d => tsOf(d.date)).concat(market.map(p => p.x));
        const pad = Math.max(2 * 864e5, (Math.max.apply(null, xs) - Math.min.apply(null, xs)) * 0.04);
        const xMin = Math.min.apply(null, xs) - pad, xMax = Math.max.apply(null, xs) + pad;
        return {
          type: 'bubble',
          data: { datasets: [
            { type: 'line', label: 'Курс системы', data: market, borderColor: 'rgba(148,163,184,.8)', backgroundColor: 'transparent', borderWidth: 1.5, pointRadius: 0, tension: 0.35, borderDash: [4, 3], order: 2 },
            { label: 'Обмен ' + meta.base + ' → ' + meta.quote, data: deals.filter(d => d.dir === 'main').map(pt), backgroundColor: 'rgba(56,189,248,.55)', borderColor: '#38bdf8', borderWidth: 1, order: 1 },
            { label: meta.quote + ' → ' + meta.base, data: deals.filter(d => d.dir === 'reverse').map(pt), backgroundColor: 'rgba(251,191,36,.55)', borderColor: '#fbbf24', borderWidth: 1, order: 1 }
          ] },
          options: {
            responsive: true, maintainAspectRatio: false, animation: { duration: 500 },
            layout: { padding: { top: 14, right: 8 } },
            scales: {
              x: { type: 'linear', min: xMin, max: xMax, ticks: { color: '#64748b', maxTicksLimit: 5, callback: v => ddmm(v), font: { size: 10 } }, grid: { color: 'rgba(255,255,255,.04)' } },
              y: { ticks: { color: '#64748b', maxTicksLimit: 5, font: { size: 10 }, callback: v => fmt(v, rateDec(v)) }, grid: { color: 'rgba(255,255,255,.05)' }, grace: '8%' }
            },
            plugins: {
              legend: { display: true, labels: { color: '#94a3b8', boxWidth: 8, boxHeight: 8, usePointStyle: true, font: { size: 10 } } },
              tooltip: { backgroundColor: '#1f2937', callbacks: { label: ctx => {
                const d = ctx.raw.d;
                if (!d) return ' Курс системы: ' + fmt(ctx.parsed.y, rateDec(ctx.parsed.y));
                return [' ' + shortDate(d.date) + ' · ' + d.user + (d.p2p ? ' · P2P' : ''), ' ' + fmt(d.baseAmt, 2) + ' ' + d.base + ' ⇄ ' + fmt(d.quoteAmt, 2) + ' ' + d.quote,
                  ' курс ' + fmt(d.rate, rateDec(d.rate)) + (d.market ? ' · рынок ' + fmt(d.market, rateDec(d.market)) : '')];
              } } }
            }
          }
        };
      }, [deals.map(d => d.id).join(','), marketNow, pairId]);

      const bars = useMemo(() => {
        const byMonth = {};
        deals.filter(d => d.dir === 'main').forEach(d => { const m = d.date.slice(0, 7); byMonth[m] = (byMonth[m] || 0) + d.quoteAmt; });
        const months = Object.keys(byMonth).sort();
        if (!months.length) return null;
        return {
          type: 'bar',
          data: { labels: months.map(m => MONTHS[Number(m.slice(5)) - 1].slice(0, 3) + ' ' + m.slice(2, 4)), datasets: [{ data: months.map(m => Math.round(byMonth[m] * 100) / 100), backgroundColor: 'rgba(52,211,153,.55)', borderColor: '#34d399', borderWidth: 1, borderRadius: 6, maxBarThickness: 36 }] },
          options: {
            responsive: true, maintainAspectRatio: false, animation: { duration: 500 },
            scales: { x: { ticks: { color: '#64748b', font: { size: 10 } }, grid: { display: false } }, y: { ticks: { color: '#64748b', maxTicksLimit: 4, font: { size: 10 }, callback: v => fmt(v, 0) }, grid: { color: 'rgba(255,255,255,.05)' } } },
            plugins: { legend: { display: false }, tooltip: { backgroundColor: '#1f2937', callbacks: { label: ctx => ' Куплено ' + money(ctx.parsed.y, meta.quote) } } }
          }
        };
      }, [deals.map(d => d.id).join(','), pairId]);

      if (!mine.length) return null;
      const tone = v => (v === null || v === undefined ? 'text-slate-300' : v >= 0 ? 'text-emerald-300' : 'text-rose-300');
      return html`
        <div>
          <div className="px-1 mb-2 text-xs uppercase tracking-widest text-slate-500">💱 Активы и валютный рынок (FX)</div>
          <${Card} className="p-4 space-y-3">
            <div className="filter-chips-scroll -mx-4">
              ${FX_TABS.map(t => html`<button key=${t.value} onClick=${() => { if (t.value !== tab) { haptic(); setTab(t.value); } }}
                className=${'sf-chip' + (tab === t.value ? ' sf-chip-active' : '') + (t.value === 'USDT' ? (has('USDT_RSD') || has('USDT_EUR') ? '' : ' opacity-40') : has(t.value) ? '' : ' opacity-40')}>${t.label}</button>`)}
            </div>
            <${Segmented} options=${FX_PERIODS} value=${period} onChange=${setPeriod} size="sm" />

    /* ============================ Умный фильтр: интерфейс ============================ */

    function SmartFilterBar({ f, onChange, onOpenPeriod, range }) {

    /** Курс валюты к EUR из ответа API (стейблкоины = USD). */
    function rateOf(cur, rates) {
      if (cur === 'EUR') return 1;
      const c = cur === 'USDT' || cur === 'USDC' ? 'USD' : cur;
      return rates && rates[c] ? rates[c] : null;
    }
    function convAmount(v, from, to, rates) {
      if (from === to) return v;
      const a = rateOf(from, rates), b = rateOf(to, rates);
      return a && b ? v / a * b : null;
    }

    /**
     * Месячные лимиты (Limits, Period=MONTH) для выбранного месяца: факт считается на клиенте из операций
     * в валюте лимита по курсу системы. «Все» — семейные лимиты; человек — его личные лимиты.
     */
    function monthLimitMap(limits, pool, range, user, users, rates) {
      const name = user === 'all' ? 'FAMILY' : ((users || []).find(u => String(u.id) === String(user)) || {}).name;
      const out = {};
      (limits || []).filter(l => l.period === 'MONTH' && l.scope === name).forEach(l => {
        const cat = l.category.toLowerCase();
        let spent = 0;
        pool.forEach(t => {
          if (t.kind !== 'expense' || (t.category || '').toLowerCase() !== cat || t.date < range.from || t.date > range.to) return;
          if (user !== 'all' && !matchUser(t, user)) return;
          const v = convAmount(t.amount || 0, t.currency, l.currency, rates);
          spent += v !== null ? v : (convAmount(t.eur || 0, 'EUR', l.currency, rates) || 0);
        });
        out[cat] = { category: l.category, amount: l.amount, currency: l.currency, spent: Math.round(spent * 100) / 100 };
      });
      return out;
    }

    function CategoryTab({ kind, pool, user, month, filter, setFilter, budgets, showBudgets, periodFrom, baseCurrency, rates, limits, users }) {

      const [open, setOpen] = useState(null);

      // «Все валюты» — в базовой валюте из Настроек (по курсу системы); нет курса — в EUR
      const base = baseCurrency && (baseCurrency === 'EUR' || (rates && rates[baseCurrency])) ? baseCurrency : 'EUR';
      const allRate = base === 'EUR' ? 1 : rates[base];
      const totals = useMemo(() => smartTotals(list, f.currency, allRate), [list, f.currency, allRate]);
      const agg = useMemo(() => smartCategories(list, f.currency, allRate), [list, f.currency, allRate]);
      const unit = f.currency === 'ALL' ? base : f.currency;
      const budgetMap = useMemo(() => {
        const m = {};
        (budgets || []).forEach(b => { m[b.category.toLowerCase()] = b; });
        return m;
      }, [budgets]);
      // Месячные лимиты из листа Limits (мультивалютные) — для «1 мес» во «Все валюты». Лимит по категории
      // заменяет старую строку Budgets (только EUR, только «Все»), дублей нет.
      const limitsOn = isExp && f.periodPreset === '1M' && f.currency === 'ALL';
      const limitMap = useMemo(() => (limitsOn ? monthLimitMap(limits, pool, range, user, users, rates) : {}), [limitsOn, limits, pool, range, user, users, rates]);
      const budgetsOn = limitsOn && (showBudgets || Object.keys(limitMap).length > 0);
      const beforeWindow = periodFrom && range.from < periodFrom && f.periodPreset === 'CUSTOM';
      useEffect(() => { setOpen(null); setLimit(30); }, [f, user]);

      return html`
        <div className="space-y-4 fade-in">
          <${SmartFilterBar} f=${f} onChange=${setFilter} onOpenPeriod=${() => setSheet(true)} range=${range} />

          <${Card} className="p-5">
